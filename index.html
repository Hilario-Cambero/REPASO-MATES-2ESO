<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repaso de Mates 2º ESO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: cercano y animoso, como un profe que corrige con boli rojo pero explica con calma
   IDEA: el cuaderno cuadriculado de la alumna: papel de cuadros, tinta azul, corrección en rojo, fluorescentes
   PICTURE: la propia hoja de ejercicios, grande, con margen rojo y la solución "corregida" a mano
   COLOUR and TYPE: papel blanco y cuadrícula azul, tinta #1e44b8, rojo corrección, 5 fluorescentes por bloque; Kalam + Nunito
   LAYOUT: portada con simulacro + 5 bloques; vista de práctica en una columna; examen en lista */
:root{color-scheme:light dark;
--paper:light-dark(#fbfcfe,#121829);--grid:light-dark(#dbe6f6,#1d2944);
--ink:light-dark(#1b2a55,#e3e8f6);--blue:light-dark(#1e44b8,#93b2ff);--red:light-dark(#cf2a3c,#ff7d8a);
--green:light-dark(#18804a,#5fe09b);--amber:light-dark(#a35f00,#ffc260);--soft:light-dark(#5b6888,#9ca8c6);
--card:light-dark(#ffffff,#19213b);--line:light-dark(#cbd6ec,#2c3a61);
--div:#ffe066;--ent:#7fe0cf;--pot:#ffb3cf;--dec:#a9c7ff;--fra:#c3ec86}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;color:var(--ink);font:17px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip;background-color:var(--paper);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:1100px;margin:0 auto;padding:clamp(20px,4vw,48px) max(4vw,14px) 60px}
h1,h2,h3{font-family:Kalam,cursive;font-weight:700;color:var(--blue);margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(36px,6vw,52px)}h2{font-size:30px}h3{font-size:24px}
p{margin:.4em 0}
.lead{color:var(--soft);max-width:60ch}
button{font:inherit;cursor:pointer}
.btn{min-height:44px;padding:8px 18px;border-radius:10px;border:2px solid var(--blue);background:transparent;color:var(--blue);font-weight:800}
.btn.ink{background:var(--blue);color:var(--card)}
.btn.red{border-color:var(--red);background:var(--red);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,.chip:focus-visible,.key:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.paper{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 0 var(--line),0 12px 30px -18px rgba(20,40,90,.45);padding:22px 22px 22px 64px}
.paper::before{content:"";position:absolute;left:44px;top:0;bottom:0;border-left:2px solid var(--red);opacity:.7}
@media(max-width:600px){.paper{padding:18px 14px 18px 30px}.paper::before{left:16px}}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;margin:18px 0 30px}
@media(max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.exam-card h2{color:var(--red)}
.counts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:700}
.chip.on{border-color:var(--blue);background:var(--blue);color:var(--card)}
.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.block{display:flex;flex-direction:column;gap:8px}
.mark{display:inline-block;padding:2px 10px;border-radius:4px;color:#1b2a55;font-family:Kalam,cursive;font-weight:700;font-size:22px;transform:rotate(-1.2deg)}
.block ul{margin:4px 0 8px;padding-left:18px;color:var(--soft);font-size:15px}
.block .stat{font-size:14px;color:var(--soft);margin-top:auto}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.topbar .sp{flex:1}
.score{font-weight:800;color:var(--blue)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--soft);font-size:15px;margin-bottom:8px}
.tag{padding:1px 10px;border-radius:4px;color:#1b2a55;font-weight:700}
.q{font-size:20px;margin:6px 0 16px}
.m{font-size:23px;margin:10px 0;overflow-x:auto;padding:4px 0}
.fb .m,.steps .m{font-size:19px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;margin:0 .12em;line-height:1.15}
.fr>span:first-child{border-bottom:1.6px solid currentColor;padding:0 .2em}
.rt{white-space:nowrap}.rt .ix{font-size:.6em;vertical-align:.9em;margin-right:-.25em}.rt .rad{border-top:1.6px solid currentColor;padding:0 .15em;margin-left:1px}
.ov{text-decoration:overline;text-decoration-thickness:1.6px}
.cifra{display:inline-block;border:2px solid var(--red);border-radius:4px;padding:0 4px;color:var(--red)}
.hl{background:var(--div);color:#1b2a55;border-radius:3px;padding:0 2px}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{min-height:48px;padding:8px 18px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:18px}
.opt.sel{border-color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}
.opt.good{border-color:var(--green);color:var(--green)}.opt.bad{border-color:var(--red);color:var(--red)}
.inrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input.ans{flex:1 1 260px;min-height:48px;font:600 20px Nunito,sans-serif;padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.key{min-width:44px;min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:800;font-size:17px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.fb{margin-top:16px}
.verdict{font-family:Kalam,cursive;font-size:28px;font-weight:700;line-height:1.1}
.ok .verdict{color:var(--green)}.bad .verdict{color:var(--red)}.part .verdict{color:var(--amber)}.inv .verdict{color:var(--amber)}
.steps{margin:10px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding:8px 0 8px 40px;border-top:1px dashed var(--line)}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:50%;border:2px solid var(--red);color:var(--red);font:700 16px/24px Kalam,cursive;text-align:center}
.bad .steps li,.part .steps li{color:var(--ink)}
.sol{color:var(--red);font-family:Kalam,cursive;font-size:21px}
table.ft{display:inline-table;border-collapse:collapse;margin:6px 14px 6px 0;font-size:17px;vertical-align:top}
table.ft td{padding:1px 10px}table.ft td:first-child{border-right:2px solid currentColor;text-align:right}
table.resta{border-collapse:collapse}table.resta td{padding:2px 8px;text-align:right}table.resta tr.tot td{border-top:2px solid currentColor}
.row{display:flex;flex-wrap:wrap}
.nota{color:var(--soft);font-size:15px}
details.help{margin:26px 0 0}details.help summary{cursor:pointer;font-weight:800;color:var(--blue);min-height:44px;display:flex;align-items:center}
.help table{border-collapse:collapse;width:100%;font-size:15px}.help td{border-top:1px solid var(--line);padding:6px 8px;vertical-align:top}
code{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:.95em;overflow-wrap:anywhere}
.exq{margin-bottom:18px}
.result-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.bigmark{font-family:Kalam,cursive;font-size:clamp(64px,12vw,110px);line-height:1;color:var(--red);border:4px solid var(--red);border-radius:50%;width:1.7em;height:1.7em;display:grid;place-items:center;transform:rotate(-6deg)}
.bars div{display:grid;grid-template-columns:9em minmax(0,1fr) 3.5em;gap:8px;align-items:center;font-size:15px;margin:4px 0}
.bars i{display:block;height:12px;border-radius:6px;background:var(--line)}.bars i b{display:block;height:100%;border-radius:6px}
.yours{color:var(--soft);font-size:15px}
.timer{font-variant-numeric:tabular-nums;font-weight:800}
@media(max-width:600px){.result-head{grid-template-columns:minmax(0,1fr)}.q{font-size:18px}.m{font-size:20px}}
@media(prefers-reduced-motion:no-preference){.fb>div{animation:pop .25s ease-out}@keyframes pop{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
{
/* ================= NÚMEROS RACIONALES EXACTOS ================= */
const B=BigInt;
const bg=(a,b)=>{a=a<0n?-a:a;b=b<0n?-b:b;while(b){[a,b]=[b,a%b]}return a};
class Q{constructor(n,d=1){n=B(n);d=B(d);if(d===0n)throw new Error('d0');if(d<0n){n=-n;d=-d}const g=bg(n,d)||1n;this.n=n/g;this.d=d/g}
add(o){return new Q(this.n*o.d+o.n*this.d,this.d*o.d)}sub(o){return new Q(this.n*o.d-o.n*this.d,this.d*o.d)}
mul(o){return new Q(this.n*o.n,this.d*o.d)}div(o){if(o.n===0n)throw new Error('d0');return new Q(this.n*o.d,this.d*o.n)}
pow(k){k=Number(k);if(!Number.isInteger(k)||Math.abs(k)>64)throw new Error('exp');let b=this;if(k<0){if(this.n===0n)throw new Error('d0');b=new Q(this.d,this.n);k=-k}return new Q(b.n**B(k),b.d**B(k))}
eq(o){return this.n===o.n&&this.d===o.d}lt(o){return this.n*o.d<o.n*this.d}
get num(){return Number(this.n)}get den(){return Number(this.d)}}

/* ================= LECTOR DE RESPUESTAS ================= */
function norm(s){return s.replace(/[−–—]/g,'-').replace(/\s+/g,'').replace(/[·×x\*]/g,'*').replace(/÷/g,':')}
function parseExpr(str){
  let s=norm(str);
  if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  let i=0;const pk=()=>s[i];
  const num=()=>{const m=s.slice(i).match(/^\d+([.,]\d+)?/);if(!m)throw new Error('syn');i+=m[0].length;const t=m[0].replace(',','.');if(t.includes('.')){const[a,b]=t.split('.');return new Q(B(a+b),10n**B(b.length))}return new Q(B(t))};
  const prim=()=>{if(pk()==='('){i++;const v=expr();if(pk()!==')')throw new Error('par');i++;return v}return num()};
  const power=()=>{const b=prim();if(pk()==='^'){i++;const e=unary();if(e.d!==1n)throw new Error('exp');return b.pow(e.n)}return b};
  const unary=()=>{if(pk()==='-'){i++;return new Q(0).sub(unary())}if(pk()==='+'){i++;return unary()}return power()};
  const term=()=>{let v=unary();while(pk()==='*'||pk()===':'||pk()==='/'){const op=s[i++];const r=unary();v=op==='*'?v.mul(r):v.div(r)}return v};
  const expr=()=>{let v=term();while(pk()==='+'||pk()==='-'){const op=s[i++];const r=term();v=op==='+'?v.add(r):v.sub(r)}return v};
  const v=expr();if(i!==s.length)throw new Error('syn');return v}

/* ================= UTILIDADES ================= */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const nz=(a,b)=>{let v;do v=R(a,b);while(v===0);return v};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a};
const lcm=(a,b)=>a/gcd(a,b)*b;
const M='−';
const sn=n=>n<0?M+(-n):''+n;
const pn=n=>n<0?`(${M}${-n})`:''+n;
const ps=n=>n<0?`(${M}${-n})`:`(+${n})`;
const fr=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const frRaw=(n,d)=>d===1?sn(n):(n<0?M:'')+fr(Math.abs(n),d);
const qi=(n,d=1)=>new Q(n,d);
const neg=q=>new Q(-q.n,q.d);
const qh=(q,par)=>{const n=q.num,d=q.den;let s=d===1?''+Math.abs(n):fr(Math.abs(n),d);if(n<0){s=M+s;if(par)s='('+s+')'}return s};
const sumHTML=l=>l.map((q,i)=>i===0?qh(q):(q.num<0?` ${M} ${qh(neg(q))}`:` + ${qh(q)}`)).join('');
const rt=(ix,rad)=>`<span class="rt">${ix&&ix!==2?`<sup class="ix">${ix}</sup>`:''}√<span class="rad">${rad}</span></span>`;
const pb=x=>x<0?`(${M}${-x})`:''+x;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isPrime=n=>{if(n<2)return false;for(let p=2;p*p<=n;p++)if(n%p===0)return false;return true};
const factorize=n=>{const f=[];let m=n;for(let p=2;p*p<=m;p++)while(m%p===0){f.push(p);m/=p}if(m>1)f.push(m);return f};
const fexp=n=>{const o={};factorize(n).forEach(p=>o[p]=(o[p]||0)+1);return o};
const fhtml=o=>{const k=Object.keys(o).map(Number).sort((a,b)=>a-b);return k.length?k.map(p=>o[p]>1?`${p}<sup>${o[p]}</sup>`:p).join(' · '):'1'};
const ftable=n=>{let r='',m=n;factorize(n).forEach(p=>{r+=`<tr><td>${m}</td><td>${p}</td></tr>`;m/=p});return `<table class="ft">${r}<tr><td>1</td><td></td></tr></table>`};
function dec(q){let n=q.n,d=q.d;const ng=n<0n;if(ng)n=-n;let s=(n/d).toString(),r=n%d,g='',k=0;while(r!==0n&&k<14){r*=10n;g+=(r/d).toString();r%=d;k++}return (ng?M:'')+s+(g?','+g:'')}
const money=q=>{const c=Math.round(q.num/q.den*100);return `${Math.floor(c/100)},${String(c%100).padStart(2,'0')} €`};
const rd=(a,b,p)=>qi(R(a*10**p,b*10**p),10**p);
function expand(n,d){const ip=Math.floor(n/d);let r=n%d;const seen={};let g='';while(r!==0&&!(r in seen)){seen[r]=g.length;r*=10;g+=Math.floor(r/d);r%=d}if(r===0)return{ip,ante:g,per:''};const s=seen[r];return{ip,ante:g.slice(0,s),per:g.slice(s)}}
const expHTML=e=>`${e.ip}${(e.ante||e.per)?','+e.ante:''}${e.per?`<span class="ov">${e.per}</span>`:''}`;
const simpSteps=(n,d)=>{const g=gcd(n,d);if(d===1||g===1)return[];return[`Simplificamos dividiendo numerador y denominador entre ${g} (su M.C.D.): ${frRaw(n,d)} = <b>${frRaw(n/g,d/g)}</b>`]};
const signNote=(a,b)=>{const k=(a.num<0)+(b.num<0);return k?` <span class="nota">(signos: ${k===1?'(+)·(−) = −':'(−)·(−) = +'})</span>`:''};

function sumFr(list){
  const dens=list.map(q=>q.den);const m=dens.reduce((a,b)=>lcm(a,b),1);const st=[];
  const nums=list.map(q=>q.num*(m/q.den));
  if(new Set(dens).size>1){
    st.push(`Los denominadores son distintos: calculamos el <b>m.c.m.(${[...new Set(dens)].join(', ')}) = ${m}</b>.`);
    st.push(`Pasamos todo a denominador ${m} (dividimos ${m} entre cada denominador y multiplicamos por el numerador):<div class="m">${sumHTML(list)} = ${nums.map((v,i)=>i===0?frRaw(v,m):(v<0?` ${M} ${fr(-v,m)}`:` + ${fr(v,m)}`)).join('')}</div>`);
  }
  const S=nums.reduce((a,b)=>a+b,0);
  st.push(`Con el mismo denominador, operamos los numeradores:<div class="m">${m===1?nums.map((v,i)=>i===0?sn(v):(v<0?` ${M} ${-v}`:` + ${v}`)).join(''):fr(nums.map((v,i)=>i===0?sn(v):(v<0?` ${M} ${-v}`:` + ${v}`)).join(''),m)} = ${frRaw(S,m)}</div>`);
  st.push(...simpSteps(S,m));
  return{res:qi(S,m),steps:st}}
function mulFr(a,b,op='·'){
  let y=b,txt='';
  if(op===':'){y=new Q(b.d,b.n);txt='Para dividir fracciones multiplicamos <b>en cruz</b>: numerador de la 1ª por denominador de la 2ª, y denominador de la 1ª por numerador de la 2ª. '}
  else txt='Multiplicamos numeradores entre sí y denominadores entre sí. ';
  const N=a.num*y.num,D=a.den*y.den;
  const top=op===':'?`${Math.abs(a.num)} · ${b.den}`:`${Math.abs(a.num)} · ${Math.abs(b.num)}`;
  const bot=op===':'?`${a.den} · ${Math.abs(b.num)}`:`${a.den} · ${b.den}`;
  return{res:qi(N,D),steps:[`${txt}<div class="m">${qh(a,true)} ${op} ${qh(b,true)} = ${N<0?M:''}${fr(top,bot)} = ${frRaw(N,D)}</div>${signNote(a,b)}`,...simpSteps(N,D)]}}
const rfr=(maxN=9,dens=[2,3,4,5,6,7,8,9,10,12])=>{const d=pick(dens);let n=R(1,maxN);if(n%d===0)n++;return qi(n,d)};

function chainSteps(t){
  const P=t.filter(v=>v>0),N=t.filter(v=>v<0),sp=P.reduce((a,b)=>a+b,0),sm=N.reduce((a,b)=>a+b,0),r=sp+sm;
  return{r,steps:[`Sumamos por un lado los <b>positivos</b>: ${P.length?P.join(' + '):'0'} = ${sp}`,`Por otro lado sumamos los <b>negativos</b>: ${N.length?N.map(v=>-v).join(' + '):'0'} = ${-sm}, es decir, ${sn(sm)}`,`Restamos y ponemos el signo del que tiene mayor valor absoluto: ${sp} ${M} ${-sm} = <b>${sn(r)}</b>`]}}
const chainHTML=t=>t.map((v,i)=>i===0?sn(v):(v<0?` ${M} ${-v}`:` + ${v}`)).join('');

/* ================= GENERADORES POR BLOQUE ================= */
const BL={
div:{name:'Divisibilidad',col:'var(--div)',desc:'Múltiplos, divisores, criterios, primos, factorización, m.c.m. y M.C.D.',list:[
['Múltiplos',()=>{const n=R(2,25),a=[1,2,3,4,5].map(k=>k*n);return{key:'m'+n,q:`Escribe los <b>cinco primeros múltiplos</b> de ${n}.`,kind:'set',ans:a,ansHTML:a.join(', '),ph:'Ej.: 4, 8, 12, 16, 20',steps:[`Los múltiplos de ${n} se obtienen multiplicando ${n} por 1, 2, 3, 4, 5…<br>${[1,2,3,4,5].map(k=>`${n} · ${k} = ${k*n}`).join('<br>')}`,`Solución: <b>${a.join(', ')}</b>`]}}],
['Divisores',()=>{const n=pick([12,16,18,20,24,28,30,32,36,40,42,44,45,48,50,54,56,60,63,64,66,70,72,75,78,80,84,88,90,96,98,100,105,108,112,120]);const ds=[],pr=[];for(let i=1;i*i<=n;i++)if(n%i===0){pr.push(`${i} · ${n/i}`);ds.push(i);if(i!==n/i)ds.push(n/i)}ds.sort((a,b)=>a-b);
 return{key:'d'+n,q:`Escribe <b>todos los divisores</b> de ${n}.`,kind:'set',ans:ds,ansHTML:ds.join(', '),ph:'Ej.: 1, 2, 3, 6',steps:[`Buscamos parejas de números que multiplicados den ${n}, probando 1, 2, 3… hasta que las parejas se repitan:<br>${pr.join(' &nbsp;|&nbsp; ')}`,`Divisores de ${n}: <b>${ds.join(', ')}</b> (${ds.length} divisores).`]}}],
['Múltiplos en un intervalo',()=>{const k=R(6,19),A=R(2,24)*25,Bn=A+R(45,80),a=[];const f=Math.floor(A/k)*k+k;for(let m=f;m<Bn;m+=k)a.push(m);
 return{key:`mi${k}-${A}-${Bn}`,q:`Escribe los múltiplos de ${k} comprendidos entre ${A} y ${Bn}.`,kind:'set',ans:a,ansHTML:a.join(', '),ph:'Ej.: 105, 112, 119',steps:[`Dividimos ${A} : ${k} = ${Math.floor(A/k)} y resto ${A%k}. El primer múltiplo mayor que ${A} es ${Math.floor(A/k)+1} · ${k} = ${f}.`,`Vamos sumando ${k} sin pasar de ${Bn}: ${a.map((v,i)=>`${Math.floor(A/k)+1+i} · ${k} = ${v}`).join('; ')}.`,`Solución: <b>${a.join(', ')}</b>`]}}],
['Primer múltiplo después de…',()=>{const k=R(7,23),N=pick([100,200,300,500,1000,2000,R(2,40)*100]);const q=Math.floor(N/k),r=N%k,a=(q+1)*k;

function potSame(op){
  const b=R(2,12),mode=pick(['pos','neg','mix']);let fs;
  if(op==='·'){fs=[...Array(R(2,3))].map(()=>({e:R(1,7),ng:mode==='neg'||(mode==='mix'&&Math.random()<.5)}))}
  else{const m=R(5,12),n=R(1,m-1);fs=[{e:m,ng:mode!=='pos'&&(mode==='neg'||Math.random()<.5)},{e:n,ng:mode==='neg'||(mode==='mix'&&Math.random()<.5)}]}
  if(mode==='mix'&&!fs.some(f=>f.ng))fs[0].ng=true;if(mode==='mix'&&fs.every(f=>f.ng))fs[fs.length-1].ng=false;
  const T=op==='·'?fs.reduce((a,f)=>a+f.e,0):fs[0].e-fs[1].e;
  const sign=fs.reduce((s,f)=>s*(f.ng&&f.e%2?-1:1),1);const allNeg=fs.every(f=>f.ng);
  const term=f=>f.ng?`(${M}${b})<sup>${f.e}</sup>`:`${b}<sup>${f.e}</sup>`;const q=fs.map(term).join(` ${op} `);
  const ansH=allNeg?`(${M}${b})<sup>${T}</sup>`:(sign<0?M:'')+`${b}<sup>${T}</sup>`;const st=[];
  if(mode==='mix')st.push(`Las bases tienen distinto signo. Vemos el signo de cada potencia: ${fs.map(f=>f.ng?`${term(f)} es ${f.e%2?'<b>negativa</b> (exponente impar)':'<b>positiva</b> (exponente par)'}`:`${term(f)} es positiva`).join('; ')}. Signo final: <b>${sign<0?'−':'+'}</b>.`);
  st.push(op==='·'?`Producto de potencias de la misma base: se deja la base y se <b>suman los exponentes</b> (a<sup>m</sup> · a<sup>n</sup> = a<sup>m+n</sup>): ${fs.map(f=>f.e).join(' + ')} = ${T}`:`Cociente de potencias de la misma base: se deja la base y se <b>restan los exponentes</b> (a<sup>m</sup> : a<sup>n</sup> = a<sup>m−n</sup>): ${fs[0].e} ${M} ${fs[1].e} = ${T}`);
  st.push(`Resultado: <b>${ansH}</b>`);
  return{key:'ps'+op+q,q:`Reduce a una sola potencia: <div class="m">${q}</div>`,kind:'value',form:'power',ans:new Q(B(sign)*B(b)**B(T)),ansHTML:ansH,ph:'Ej.: 2^7  o  -2^7',steps:st}}

function mcmSteps(ns,isM){
  const fs=ns.map(fexp);const st=[`Descomponemos en factores primos:<div class="row">${ns.map(ftable).join('')}</div>${ns.map((n,i)=>`${n} = ${fhtml(fs[i])}`).join('<br>')}`];
  const all=new Set(fs.flatMap(o=>Object.keys(o).map(Number)));const res={};
  if(isM){all.forEach(p=>res[p]=Math.max(...fs.map(o=>o[p]||0)));st.push(`m.c.m.: factores <b>comunes y no comunes</b> elevados al <b>mayor exponente</b>: ${fhtml(res)}`)}
  else{all.forEach(p=>{if(fs.every(o=>o[p]))res[p]=Math.min(...fs.map(o=>o[p]))});st.push(Object.keys(res).length?`M.C.D.: solo los factores <b>comunes</b> elevados al <b>menor exponente</b>: ${fhtml(res)}`:'No hay factores primos comunes, así que el M.C.D. es 1.')}
  const val=Object.entries(res).reduce((a,[p,e])=>a*p**e,1);st.push(`Calculamos: ${fhtml(res)} = <b>${val}</b>`);return{val,steps:st}}

const POW=[/^[-+]?(\([-+]?\d+(\/\d+)?\)|\d+)\^[-+]?\d+$/,/^[-+]?\d+\^\d+\/\d+\^\d+$/];
function check(ex,raw){
  let s=(raw||'').trim();if(!s)return{st:'empty'};
  try{
  if(ex.kind==='mc')return{st:raw===ex.ans?'ok':'bad'};
  if(ex.kind==='set'){const v=norm(s).split(/[;,]+/).filter(Boolean);if(v.some(x=>!/^-?\d+$/.test(x)))return{st:'inv',msg:'Escribe solo números enteros separados por comas.'};const a=new Set(v.map(Number)),b=new Set(ex.ans);const miss=[...b].filter(x=>!a.has(x)),extra=[...a].filter(x=>!b.has(x));if(!miss.length&&!extra.length)return{st:'ok'};return{st:'bad',msg:[miss.length?`Te faltan: ${miss.join(', ')}.`:'',extra.length?`Sobran: ${extra.join(', ')}.`:''].join(' ')}}
  if(ex.kind==='seq'){const parts=s.split(/<|;/).map(x=>x.trim()).filter(Boolean);if(parts.length!==ex.ans.length)return{st:'inv',msg:`Escribe los ${ex.ans.length} números separados por el signo &lt;.`};const v=parts.map(parseExpr);return{st:v.every((x,i)=>x.eq(ex.ans[i]))?'ok':'bad'}}
  if(ex.kind==='factor'){const parts=norm(s).split('*');let prod=1,allP=true;for(const p of parts){const m=p.match(/^(\d+)(\^(\d+))?$/);if(!m)return{st:'inv',msg:'Escribe los factores así: 2^3·3·5'};const b=+m[1],e=m[3]?+m[3]:1;if(!isPrime(b))allP=false;prod*=b**e}if(prod!==ex.ans)return{st:'bad'};return allP?{st:'ok'}:{st:'part',msg:'El producto es correcto, pero <b>algún factor no es primo</b>: hay que seguir descomponiendo.'}}
  s=s.replace(/€|euros?|grados?|vasos?|litros?|metros?|alumnos|chicos|caramelos|canicas|d[ií]as|minutos|segundos|cm|dm|kg|°c?|º/gi,'').trim();
  const v=parseExpr(s),n=norm(s);
  if(ex.form==='power'){const m=POW.some(r=>r.test(n));if(!v.eq(ex.ans))return{st:'bad'};if(!m)return{st:'part',msg:'El valor es correcto, pero hay que dejarlo como <b>una sola potencia</b> (por ejemplo 2^7).'};if(ex.base&&!new RegExp('^\\(?'+ex.base+'\\)?\\^').test(n))return{st:'part',msg:`Es correcto, pero la base tiene que ser ${ex.base}.`};return{st:'ok'}}
  const single=/^[-+]?\d+([.,]\d+)?(\/[-+]?\d+)?$/.test(n.replace(/[()]/g,''));
  if(!single)return{st:'inv',msg:'Escribe solo el <b>resultado final</b> (un número o una fracción), sin operaciones.'};
  if(!v.eq(ex.ans))return{st:'bad'};
  if(ex.form==='decimal'&&n.includes('/'))return{st:'part',msg:'El valor es correcto, pero se pide como <b>número decimal</b> (con coma).'};
  if(ex.simplify){const m=n.replace(/[()+-]/g,'').match(/^(\d+)\/(\d+)$/);if(m&&(gcd(+m[1],+m[2])>1||+m[2]===1))return{st:'part',msg:'El resultado es equivalente, pero <b>no está simplificado</b>. ¡Recuerda simplificar siempre!'}}
  return{st:'ok'}
  }catch(e){return{st:'inv',msg:'No he entendido lo que has escrito. Revisa el formato (mira la ayuda de abajo).'}}}

/* ================= ESTADO Y MEMORIA ================= */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let seen=new Set(store.get('rm-seen',[]));
let stats=store.get('rm-stats',{});
const saveSeen=()=>{const a=[...seen];store.set('rm-seen',a.slice(-3000))};
function gen(b,fi,avoid){const L=BL[b].list;for(let t=0;t<80;t++){let i=fi!=null?fi:R(0,L.length-1);if(fi==null&&avoid!=null&&L.length>1&&i===avoid&&t<20)continue;let ex;try{ex=L[i][1]()}catch(e){console.error(e);continue}ex.label=L[i][0];ex.block=b;ex.gi=i;const k=b+'|'+ex.key;if(seen.has(k)&&t<70)continue;seen.add(k);saveSeen();return ex}}
const S={view:'home',block:null,filter:null,ex:null,done:false,ok:0,tot:0,streak:0,n:0,examN:15,exam:null};
const app=document.getElementById('app');

/* ================= VISTAS ================= */
const KEYS={value:['/','^','−','(',')',','],factor:['^','·'],set:[','],seq:['<','−',',']};
function answerUI(ex,id){
  if(ex.kind==='mc')return `<div class="opts" data-id="${id}">${ex.opts.map(o=>`<button class="opt" data-o="${esc(o)}">${o}</button>`).join('')}</div>`;
  return `<div class="inrow"><input class="ans" id="in-${id}" data-id="${id}" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text" placeholder="${esc(ex.ph||'Escribe el resultado')}"></div><div class="keys">${KEYS[ex.kind].map(k=>`<button class="key" data-k="${k}" data-for="in-${id}" aria-label="Insertar ${k}">${k}</button>`).join('')}</div>`}
const stepsHTML=ex=>`<ol class="steps">${ex.steps.map(s=>`<li>${s}</li>`).join('')}</ol>`;
function fbHTML(ex,r){
  if(r.st==='ok')return `<div class="ok"><div class="verdict">¡Correcto! ✔</div><details><summary class="nota" style="cursor:pointer;min-height:44px;display:flex;align-items:center">Ver cómo se resuelve</summary>${stepsHTML(ex)}</details></div>`;
  if(r.st==='part')return `<div class="part"><div class="verdict">Casi… (medio punto)</div><p>${r.msg}</p><p class="sol">Solución: ${ex.ansHTML}</p>${stepsHTML(ex)}</div>`;
  if(r.st==='inv'||r.st==='empty')return `<div class="inv"><div class="verdict">Revisa cómo lo has escrito</div><p>${r.msg||'Escribe una respuesta antes de comprobar.'}</p></div>`;
  if(r.st==='seen')return `<div class="bad"><p class="sol">Solución: ${ex.ansHTML}</p>${stepsHTML(ex)}</div>`;
  return `<div class="bad"><div class="verdict">No es correcto ✘</div>${r.msg?`<p>${r.msg}</p>`:''}<p class="sol">Solución: ${ex.ansHTML}</p><p class="nota">Compara tu resolución con estos pasos para ver dónde está el fallo:</p>${stepsHTML(ex)}</div>`}
const HELP=`<details class="help"><summary>¿Cómo escribo las respuestas?</summary><table>
<tr><td>Negativos</td><td><code>-7</code></td></tr><tr><td>Fracciones</td><td><code>3/4</code> &nbsp; <code>-5/12</code> (siempre simplificadas)</td></tr>
<tr><td>Decimales</td><td><code>2,75</code> (con coma; sin puntos de miles)</td></tr><tr><td>Potencias</td><td><code>2^7</code> &nbsp; <code>-2^12</code> &nbsp; <code>(-3)^5</code> &nbsp; <code>(2/5)^7</code></td></tr>
<tr><td>Factores primos</td><td><code>2^3·3·5</code> (también vale <code>2^3*3*5</code>)</td></tr><tr><td>Listas</td><td><code>1, 2, 4, 5, 10, 20</code></td></tr><tr><td>Ordenar</td><td><code>-8 &lt; -3 &lt; 0 &lt; 5</code></td></tr>
<tr><td>Problemas</td><td>Solo el número: <code>72</code> o <code>6,12</code></td></tr></table></details>`;

function home(){
  const st=b=>{const s=stats[b];return s&&s.tot?`Llevas ${s.ok} de ${s.tot} bien (${Math.round(s.ok/s.tot*100)} %)`:'Aún sin practicar'};
  app.innerHTML=`<div class="hero"><div><h1>Repaso de Mates · 2º ESO</h1><p class="lead">Ejercicios nuevos cada vez, del estilo de los del cuaderno. Si fallas, te enseña la resolución paso a paso para que encuentres el error.</p></div>
  <div class="paper exam-card"><h2>Simulacro de examen</h2><p>Ejercicios mezclados de todos los bloques. Se corrige al final con nota sobre 10.</p>
  <div class="counts" role="group" aria-label="Número de ejercicios">${[10,15,20].map(n=>`<button class="chip ${S.examN===n?'on':''}" data-en="${n}">${n} ejercicios</button>`).join('')}</div>
  <button class="btn red" data-go="exam">Empezar simulacro</button></div></div>
  <h2 style="margin-bottom:14px">Practicar por bloques</h2>
  <div class="blocks">${Object.entries(BL).map(([k,b])=>`<div class="paper block"><span class="mark" style="background:${b.col}">${b.name}</span><p class="nota" style="margin:2px 0">${b.desc}</p><ul>${b.list.map(l=>`<li>${l[0]}</li>`).join('')}</ul><div class="stat">${st(k)}</div><button class="btn ink" data-go="practice" data-b="${k}">Practicar</button></div>`).join('')}</div>${HELP}`}

function practice(){
  const b=BL[S.block],ex=S.ex;
  app.innerHTML=`<div class="topbar"><button class="btn" data-go="home">← Inicio</button><span class="mark" style="background:${b.col}">${b.name}</span><span class="sp"></span><span class="score">✔ ${S.ok} / ${S.tot}${S.streak>2?` · racha ${S.streak} 🔥`:''}</span></div>
  <div class="filters" role="group" aria-label="Tipo de ejercicio"><button class="chip ${S.filter==null?'on':''}" data-f="">Todos mezclados</button>${b.list.map((l,i)=>`<button class="chip ${S.filter===i?'on':''}" data-f="${i}">${l[0]}</button>`).join('')}</div>
  <div class="paper"><div class="meta"><span class="tag" style="background:${b.col}">${ex.label}</span><span>Ejercicio ${S.n}</span></div>
  <div class="q">${ex.q}</div>${answerUI(ex,'p')}<div class="fb" id="fb"></div>
  <div class="actions"><button class="btn ink" id="check">Comprobar</button><button class="btn" id="sol">Ver solución</button><button class="btn" id="next">Siguiente →</button></div></div>${HELP}`;
  const inp=document.getElementById('in-p');if(inp)inp.focus({preventScroll:true})}

function newEx(){S.ex=gen(S.block,S.filter,S.ex?S.ex.gi:null);S.done=false;S.sel=null;S.n++;practice()}
function record(b,okv){stats[b]=stats[b]||{ok:0,tot:0};stats[b].tot++;stats[b].ok+=okv;store.set('rm-stats',stats)}

function doCheck(){
  if(S.done)return;const ex=S.ex;const raw=ex.kind==='mc'?S.sel:document.getElementById('in-p').value;const r=check(ex,raw);
  document.getElementById('fb').innerHTML=fbHTML(ex,r);
  if(r.st==='inv'||r.st==='empty')return;
  S.done=true;S.tot++;const pts=r.st==='ok'?1:r.st==='part'?.5:0;S.ok+=pts===1?1:0;S.streak=pts===1?S.streak+1:0;record(S.block,pts===1?1:0);
  lock(r);document.querySelector('.score').innerHTML=`✔ ${S.ok} / ${S.tot}${S.streak>2?` · racha ${S.streak} 🔥`:''}`;document.getElementById('next').classList.add('ink');document.getElementById('next').focus()}
function lock(r){const ex=S.ex;document.getElementById('check').disabled=true;document.getElementById('sol').disabled=true;const inp=document.getElementById('in-p');if(inp)inp.disabled=true;
  document.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(o.dataset.o===ex.ans)o.classList.add('good');else if(o.classList.contains('sel'))o.classList.add('bad')})}

/* ---------- Simulacro ---------- */
function startExam(){
  const ks=Object.keys(BL),per=Math.floor(S.examN/ks.length),extra=S.examN%ks.length,qs=[];
  shuf(ks).forEach((b,j)=>{const n=per+(j<extra?1:0);const idx=shuf(BL[b].list.map((_,i)=>i));for(let i=0;i<n;i++)qs.push(gen(b,idx[i%idx.length]))});
  S.exam={qs:shuf(qs),ans:{},t0:Date.now(),done:false};S.view='exam';examView()}
let tick=null;
function examView(){
  const E=S.exam;
  app.innerHTML=`<div class="topbar"><button class="btn" data-go="home">← Salir</button><h2 style="color:var(--red)">Simulacro</h2><span class="sp"></span><span class="timer" id="timer">00:00</span></div>
  <p class="lead">Resuelve en tu cuaderno y escribe aquí solo el resultado. Al final pulsa <b>Entregar</b>.</p>
  ${E.qs.map((ex,i)=>`<div class="paper exq"><div class="meta"><span class="tag" style="background:${BL[ex.block].col}">${BL[ex.block].name} · ${ex.label}</span><span>${i+1} / ${E.qs.length}</span></div><div class="q">${ex.q}</div>${answerUI(ex,'e'+i)}</div>`).join('')}
  <div class="actions"><button class="btn red" id="hand">Entregar y corregir</button></div>${HELP}`;
  clearInterval(tick);tick=setInterval(()=>{const el=document.getElementById('timer');if(!el){clearInterval(tick);return}const s=Math.floor((Date.now()-E.t0)/1000);el.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`},1000)}
function handIn(){
  const E=S.exam;clearInterval(tick);const secs=Math.floor((Date.now()-E.t0)/1000);
  E.qs.forEach((ex,i)=>{if(ex.kind!=='mc'){const el=document.getElementById('in-e'+i);E.ans[i]=el?el.value:''}});
  const res=E.qs.map((ex,i)=>{let r=check(ex,E.ans[i]);if(r.st==='inv'||r.st==='empty')r={st:'bad',msg:r.st==='empty'?'Sin responder.':r.msg};return r});
  const pts=res.map(r=>r.st==='ok'?1:r.st==='part'?.5:0);const tot=pts.reduce((a,b)=>a+b,0);const nota=Math.round(tot/E.qs.length*100)/10;
  E.qs.forEach((ex,i)=>record(ex.block,pts[i]===1?1:0));
  const byB={};E.qs.forEach((ex,i)=>{byB[ex.block]=byB[ex.block]||[0,0];byB[ex.block][0]+=pts[i];byB[ex.block][1]++});
  const msg=nota>=9?'¡Sobresaliente! Lo tienes dominado.':nota>=7?'¡Muy bien! Repasa los fallos y listo.':nota>=5?'Aprobado. Practica los bloques más flojos.':'Hay que repasar. Practica por bloques empezando por el más bajo.';
  app.innerHTML=`<div class="topbar"><button class="btn" data-go="home">← Inicio</button><span class="sp"></span><button class="btn red" data-go="exam">Otro simulacro</button></div>
  <div class="paper"><div class="result-head"><div class="bigmark">${String(nota).replace('.',',')}</div><div><h2>${msg}</h2><p>${String(tot).replace('.',',')} de ${E.qs.length} puntos · tiempo ${Math.floor(secs/60)} min ${secs%60} s</p>
  <div class="bars">${Object.entries(byB).map(([b,[p,n]])=>`<div><span>${BL[b].name}</span><i><b style="width:${p/n*100}%;background:${BL[b].col}"></b></i><span>${String(p).replace('.',',')}/${n}</span></div>`).join('')}</div></div></div></div>
  <h2 style="margin:26px 0 12px">Corrección</h2>
  ${E.qs.map((ex,i)=>`<div class="paper exq"><div class="meta"><span class="tag" style="background:${BL[ex.block].col}">${BL[ex.block].name} · ${ex.label}</span><span>${i+1}</span></div><div class="q">${ex.q}</div><p class="yours">Tu respuesta: <b>${E.ans[i]?esc(E.ans[i]):'—'}</b></p><div class="fb">${fbHTML(ex,res[i])}</div></div>`).join('')}`;
  window.scrollTo(0,0)}

/* ================= EVENTOS ================= */
function render(){if(S.view==='home')home();else if(S.view==='practice')practice();else examView()}
app.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.go){const g=t.dataset.go;if(g==='home'){clearInterval(tick);S.view='home';home();window.scrollTo(0,0)}else if(g==='practice'){S.view='practice';S.block=t.dataset.b;S.filter=null;S.ok=0;S.tot=0;S.n=0;S.streak=0;S.ex=null;newEx();window.scrollTo(0,0)}else if(g==='exam'){startExam();window.scrollTo(0,0)}return}
  if(t.dataset.en){S.examN=+t.dataset.en;home();return}
  if(t.dataset.f!==undefined){S.filter=t.dataset.f===''?null:+t.dataset.f;newEx();return}
  if(t.dataset.k){const inp=document.getElementById(t.dataset.for);if(inp&&!inp.disabled){const k=t.dataset.k==='−'?'-':t.dataset.k;const p=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,p)+k+inp.value.slice(inp.selectionEnd??p);inp.focus();inp.setSelectionRange(p+k.length,p+k.length)}return}
  if(t.classList.contains('opt')){const box=t.parentElement;box.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));t.classList.add('sel');const id=box.dataset.id;if(id==='p')S.sel=t.dataset.o;else S.exam.ans[+id.slice(1)]=t.dataset.o;return}
  if(t.id==='check')doCheck();else if(t.id==='next')newEx();else if(t.id==='sol'){if(!S.done){S.done=true;document.getElementById('fb').innerHTML=fbHTML(S.ex,{st:'seen'});lock({st:'seen'});document.getElementById('next').classList.add('ink')}}else if(t.id==='hand')handIn();
});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='in-p'){e.preventDefault();if(S.done)newEx();else doCheck()}});
home();
}
</script>
</body>
